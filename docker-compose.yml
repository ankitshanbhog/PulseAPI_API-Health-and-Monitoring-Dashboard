version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: api_monitoring_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: api_monitoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_monitoring_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/api_monitoring
      JWT_SECRET: super_jwt_secret_production_key_2026
      JWT_EXPIRES_IN: 7d
      DEFAULT_CHECK_INTERVAL_CRON: "* * * * *"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api_monitoring_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
